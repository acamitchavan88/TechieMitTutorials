version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:8.0

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Show project structure
          command: |
            echo "Current directory:"
            pwd

            echo "Repository contents:"
            ls -la

            echo "Java source files:"
            find DesignPrinciples/src -name "*.java" -type f

      - run:
          name: Compile Java sources
          command: |
            mkdir -p DesignPrinciples/bin
            javac -d DesignPrinciples/bin $(find DesignPrinciples/src -name "*.java")

      - run:
          name: Run application
          command: |
            java -cp DesignPrinciples/bin BookPrototyeClientImp

workflows:
  build-and-run:
    jobs:
      - build