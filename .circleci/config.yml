version: 2
jobs:
  build:
    docker:
      - image: circleci/openjdk:8-jdk
    working_directory: ~/repo/DesignPrinciples

    steps:
      - checkout

      - run:
          name: Compile Java sources
          command: |
            mkdir -p bin
            javac -d bin $(find src -name "*.java")

      - run:
          name: Run application
          command: java -cp bin Main
